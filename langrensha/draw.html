<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人杀抽卡台</title>
    <style>
        :root {
            --primary-bg: #1a1a2e;
            --text-color: #e94560;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--primary-bg);
            color: #fff;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 34px 20px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        h1 {
            margin: 0;
            font-size: 2.2em;
        }

        .nav-link {
            color: #bbb;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .draw-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 20px;
        }

        .draw-subtitle {
            margin: 0 0 18px;
            color: #bbb;
            font-size: 0.95em;
        }

        .draw-config-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        .config-panel {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .config-panel h3 {
            margin-top: 0;
            font-size: 1.05em;
            color: #ddd;
        }

        .role-config-group {
            margin-bottom: 12px;
        }

        .role-config-group-title {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .role-config-list {
            display: grid;
            gap: 8px;
        }

        .role-config-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 10px;
        }

        .role-config-item label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.95em;
        }

        .role-count-input {
            width: 70px;
            background: #111;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 6px;
            padding: 6px 8px;
        }

        .role-count-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .custom-role-controls {
            display: grid;
            grid-template-columns: 1fr 90px auto;
            gap: 8px;
            margin-bottom: 10px;
        }

        .custom-role-controls input {
            background: #111;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 6px;
            padding: 8px 10px;
        }

        .custom-role-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 8px;
            max-height: 230px;
            overflow-y: auto;
        }

        .custom-role-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.95em;
        }

        .draw-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-btn {
            background-color: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background-color: var(--text-color);
            border-color: var(--text-color);
        }

        .draw-status {
            color: #bbb;
            font-size: 0.95em;
            margin: 0;
        }

        .draw-panel {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .draw-panel.hidden {
            display: none;
        }

        .hidden {
            display: none !important;
        }

        .draw-card {
            width: min(320px, 80vw);
            height: 190px;
            perspective: 1000px;
            cursor: pointer;
        }

        .draw-card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .draw-card.is-flipped .draw-card-inner {
            transform: rotateY(180deg);
        }

        .draw-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            backface-visibility: hidden;
            text-align: center;
            padding: 0 12px;
            box-sizing: border-box;
        }

        .draw-back {
            background: linear-gradient(135deg, #2b2d42, #1f2235);
            color: #fff;
        }

        .draw-front {
            background: linear-gradient(135deg, #3c1642, #086972);
            transform: rotateY(180deg);
            color: #fff;
        }

        .all-result {
            margin-top: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 14px;
        }

        .all-result h3 {
            margin: 0 0 10px;
            font-size: 1.05em;
            color: #ffd700;
        }

        .console-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .mini-btn {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 0.82em;
            cursor: pointer;
        }

        .mini-btn:hover {
            background: rgba(255,255,255,0.18);
        }

        .all-result-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 6px;
        }

        .all-result-list li {
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-row.marked .player-role {
            text-decoration: line-through;
            opacity: 0.75;
        }

        .player-no {
            min-width: 64px;
            color: #bbb;
            font-variant-numeric: tabular-nums;
        }

        .player-role {
            color: #fff;
            flex: 1;
        }

        .row-actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }

        .removed-block {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255,255,255,0.15);
        }

        .removed-title {
            color: #bbb;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .removed-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 6px;
        }

        @media (max-width: 600px) {
            .draw-config-grid {
                grid-template-columns: 1fr;
            }
            .custom-role-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>🎴 狼人杀抽卡台</h1>
    <a class="nav-link" href="./index.html">返回角色图鉴</a>
</header>

<div class="container">
    <div class="draw-section">
        <p class="draw-subtitle">先配置本局角色及数量（支持自定义角色），再点击抽卡区按“背面 → 正面 → 背面 → 下一张”顺序发牌。</p>

        <div class="draw-config-grid">
            <div class="config-panel">
                <h3>本局角色设置</h3>
                <div id="role-config-root"></div>
            </div>

            <div class="config-panel">
                <h3>自定义角色</h3>
                <div class="custom-role-controls">
                    <input type="text" id="custom-role-name" placeholder="角色名称（如：机械师）">
                    <input type="number" id="custom-role-count" min="1" value="1">
                    <button class="action-btn" type="button" onclick="addCustomRole()">添加</button>
                </div>
                <ul class="custom-role-list" id="custom-role-list"></ul>
            </div>
        </div>

        <div class="draw-actions">
            <button class="action-btn" type="button" onclick="startDrawSession()">开始随机抽卡</button>
            <button class="action-btn" type="button" onclick="restoreLastConfig()">一键恢复上局配置</button>
            <button class="action-btn" id="reveal-all-btn" type="button" onclick="confirmRevealAllRoles()">显示身份控制台</button>
            <button class="action-btn" type="button" onclick="restoreBackupSession()">恢复上一局控制台</button>
            <p class="draw-status" id="draw-status">尚未开始抽卡。</p>
        </div>

        <div class="draw-panel hidden" id="draw-panel">
            <div class="draw-card" id="draw-card" onclick="handleDrawCardClick()">
                <div class="draw-card-inner">
                    <div class="draw-face draw-back">点击查看角色</div>
                    <div class="draw-face draw-front" id="draw-front-text">角色</div>
                </div>
            </div>
            <p class="draw-status">提示：翻到正面是当前玩家身份，再点一次会翻回背面并推进到下一张。</p>
        </div>

        <div class="all-result hidden" id="all-result">
            <h3>🧑‍⚖️ 身份控制台（仅法官查看）</h3>
            <div class="console-actions">
                <button class="mini-btn" id="reset-temp-btn" type="button" onclick="resetJudgeAnnotations()">临时恢复初始状态</button>
                <button class="mini-btn hidden" id="restore-temp-btn" type="button" onclick="restoreTemporaryJudgeState()">恢复临时前状态</button>
            </div>
            <ul class="all-result-list" id="all-result-list"></ul>
            <div class="removed-block hidden" id="removed-block">
                <div class="removed-title">已删除玩家（可恢复）</div>
                <ul class="removed-list" id="removed-list"></ul>
            </div>
        </div>
    </div>
</div>

<script src="./roles-data.js"></script>
<script>
    const roleTypeMeta = {
        god: { title: '神职' },
        villager: { title: '平民' },
        wolf: { title: '狼人' },
        third: { title: '第三方' }
    };

    const STORAGE_KEY = 'langrensha_last_config_v1';
    const SESSION_STORAGE_KEY = 'langrensha_current_session_v1';
    const SESSION_BACKUP_KEY = 'langrensha_last_session_backup_v1';

    const customRoles = [];
    let drawDeck = [];
    let drawIndex = 0;
    let drawFrontVisible = false;
    let judgeState = {};
    let tempJudgeStateSnapshot = null;

    const drawPanel = document.getElementById('draw-panel');
    const drawCard = document.getElementById('draw-card');
    const drawFrontText = document.getElementById('draw-front-text');
    const drawStatus = document.getElementById('draw-status');
    const revealAllBtn = document.getElementById('reveal-all-btn');
    const allResult = document.getElementById('all-result');
    const allResultList = document.getElementById('all-result-list');
    const resetTempBtn = document.getElementById('reset-temp-btn');
    const restoreTempBtn = document.getElementById('restore-temp-btn');
    const removedBlock = document.getElementById('removed-block');
    const removedList = document.getElementById('removed-list');
    const roleConfigRoot = document.getElementById('role-config-root');
    const customRoleList = document.getElementById('custom-role-list');

    function isSessionFinished() {
        return drawDeck.length > 0 && !drawFrontVisible && drawIndex >= drawDeck.length;
    }

    function ensureJudgeState() {
        for (let i = 1; i <= drawDeck.length; i++) {
            if (!judgeState[i]) {
                judgeState[i] = { marked: false, removed: false };
            }
        }
    }

    function cloneJudgeState(state) {
        return JSON.parse(JSON.stringify(state || {}));
    }

    function updateTempActionButtons() {
        const inTemporaryMode = Boolean(tempJudgeStateSnapshot);
        resetTempBtn.classList.toggle('hidden', inTemporaryMode);
        restoreTempBtn.classList.toggle('hidden', !inTemporaryMode);
    }

    function applyConfig(config) {
        document.querySelectorAll('.role-enable').forEach(checkbox => {
            checkbox.checked = false;
        });
        document.querySelectorAll('.role-count-input').forEach(input => {
            input.value = '1';
            input.disabled = true;
        });

        (config?.selectedRoles || []).forEach(item => {
            const checkbox = document.querySelector(`.role-enable[data-role-id="${item.id}"]`);
            const countInput = document.querySelector(`.role-count-input[data-role-id="${item.id}"]`);
            if (!checkbox || !countInput) return;
            checkbox.checked = true;
            countInput.disabled = false;
            countInput.value = Math.max(1, Number(item.count) || 1);
        });

        customRoles.length = 0;
        (config?.customRoles || []).forEach(item => {
            if (!item.name) return;
            customRoles.push({
                id: `custom_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                name: item.name,
                icon: '🃏',
                count: Math.max(1, Number(item.count) || 1)
            });
        });
        renderCustomRoles();
    }

    function renderRoleConfig() {
        const grouped = { god: [], villager: [], wolf: [], third: [] };
        roles.forEach(role => {
            if (grouped[role.type]) grouped[role.type].push(role);
        });

        roleConfigRoot.innerHTML = '';

        Object.keys(grouped).forEach(type => {
            const groupWrap = document.createElement('div');
            groupWrap.className = 'role-config-group';

            const title = document.createElement('div');
            title.className = 'role-config-group-title';
            title.textContent = roleTypeMeta[type].title;
            groupWrap.appendChild(title);

            const list = document.createElement('div');
            list.className = 'role-config-list';

            grouped[type].forEach(role => {
                const item = document.createElement('div');
                item.className = 'role-config-item';
                item.innerHTML = `
                    <label>
                        <input type="checkbox" class="role-enable" data-role-id="${role.id}">
                        <span>${role.icon} ${role.name}</span>
                    </label>
                    <input type="number" class="role-count-input" data-role-id="${role.id}" min="1" value="1" disabled>
                `;

                const checkbox = item.querySelector('.role-enable');
                const countInput = item.querySelector('.role-count-input');
                checkbox.addEventListener('change', () => {
                    countInput.disabled = !checkbox.checked;
                });

                list.appendChild(item);
            });

            groupWrap.appendChild(list);
            roleConfigRoot.appendChild(groupWrap);
        });
    }

    function addCustomRole() {
        const nameInput = document.getElementById('custom-role-name');
        const countInput = document.getElementById('custom-role-count');
        const name = nameInput.value.trim();
        const count = Math.max(1, Number(countInput.value) || 1);

        if (!name) {
            alert('请输入自定义角色名称。');
            return;
        }

        customRoles.push({
            id: `custom_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            name,
            icon: '🃏',
            count
        });

        nameInput.value = '';
        countInput.value = '1';
        renderCustomRoles();
    }

    function removeCustomRole(index) {
        customRoles.splice(index, 1);
        renderCustomRoles();
    }

    function renderCustomRoles() {
        customRoleList.innerHTML = '';

        if (customRoles.length === 0) {
            customRoleList.innerHTML = '<li class="custom-role-item">暂无自定义角色</li>';
            return;
        }

        customRoles.forEach((role, index) => {
            const item = document.createElement('li');
            item.className = 'custom-role-item';
            item.innerHTML = `
                <span>🃏 ${role.name} × ${role.count}</span>
                <button class="action-btn" type="button" onclick="removeCustomRole(${index})">移除</button>
            `;
            customRoleList.appendChild(item);
        });
    }

    function getCurrentConfigForSave() {
        const selectedRoles = [];
        document.querySelectorAll('.role-enable').forEach(checkbox => {
            if (!checkbox.checked) return;
            const roleId = checkbox.dataset.roleId;
            const countInput = document.querySelector(`.role-count-input[data-role-id="${roleId}"]`);
            const count = Math.max(1, Number(countInput?.value) || 1);
            selectedRoles.push({ id: roleId, count });
        });

        const custom = customRoles.map(role => ({
            name: role.name,
            count: Math.max(1, Number(role.count) || 1)
        }));

        return { selectedRoles, customRoles: custom };
    }

    function saveCurrentConfig() {
        const config = getCurrentConfigForSave();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
    }

    function hasActiveSession() {
        return drawDeck.length > 0;
    }

    function saveCurrentSessionState() {
        if (!hasActiveSession()) {
            localStorage.removeItem(SESSION_STORAGE_KEY);
            return;
        }

        ensureJudgeState();

        const state = {
            drawDeck,
            drawIndex,
            drawFrontVisible,
            allResultVisible: !allResult.classList.contains('hidden'),
            config: getCurrentConfigForSave(),
            judgeState,
            tempJudgeStateSnapshot
        };

        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(state));
    }

    function backupCurrentSessionState() {
        if (!hasActiveSession()) return;
        saveCurrentSessionState();
        const raw = localStorage.getItem(SESSION_STORAGE_KEY);
        if (raw) {
            localStorage.setItem(SESSION_BACKUP_KEY, raw);
        }
    }

    function restoreBackupSession() {
        const raw = localStorage.getItem(SESSION_BACKUP_KEY);
        if (!raw) {
            alert('没有可恢复的上一局控制台。');
            return;
        }

        const currentRaw = localStorage.getItem(SESSION_STORAGE_KEY);
        if (currentRaw) {
            const keyword = prompt('当前局状态将被上一局控制台覆盖。\n请输入“恢复上一局”继续：');
            if (keyword === null) return;
            if (keyword.trim() !== '恢复上一局') {
                alert('口令错误，已取消恢复。');
                return;
            }
        }

        localStorage.setItem(SESSION_STORAGE_KEY, raw);
        restoreCurrentSessionState();
        drawStatus.textContent = '已恢复上一局身份控制台。';
    }

    function restoreCurrentSessionState() {
        const raw = localStorage.getItem(SESSION_STORAGE_KEY);
        if (!raw) return;

        try {
            const state = JSON.parse(raw);

            if (state?.config) {
                applyConfig(state.config);
            }

            if (!Array.isArray(state?.drawDeck) || state.drawDeck.length === 0) {
                return;
            }

            drawDeck = state.drawDeck
                .filter(item => item && item.name)
                .map(item => ({ name: item.name, icon: item.icon || '🃏' }));

            if (drawDeck.length === 0) {
                localStorage.removeItem(SESSION_STORAGE_KEY);
                return;
            }

            drawIndex = Math.max(0, Math.min(Number(state.drawIndex) || 0, drawDeck.length));
            drawFrontVisible = Boolean(state.drawFrontVisible) && drawIndex < drawDeck.length;
            judgeState = state?.judgeState && typeof state.judgeState === 'object' ? state.judgeState : {};
            tempJudgeStateSnapshot = state?.tempJudgeStateSnapshot && typeof state.tempJudgeStateSnapshot === 'object'
                ? state.tempJudgeStateSnapshot
                : null;
            ensureJudgeState();
            updateTempActionButtons();

            drawPanel.classList.remove('hidden');
            allResult.classList.add('hidden');

            if (drawFrontVisible) {
                const currentRole = drawDeck[drawIndex];
                drawFrontText.textContent = `${currentRole.icon} ${currentRole.name}`;
                drawCard.classList.add('is-flipped');
            } else {
                drawFrontText.textContent = '角色';
                drawCard.classList.remove('is-flipped');
            }

            const isFinished = !drawFrontVisible && drawIndex >= drawDeck.length;
            if (state.allResultVisible && isFinished) {
                renderAllRolesResult();
                allResult.classList.remove('hidden');
            }

            drawStatus.textContent = '已自动恢复当前局状态。';
            updateDrawStatus();
        } catch {
            localStorage.removeItem(SESSION_STORAGE_KEY);
        }
    }

    function restoreLastConfig() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
            alert('还没有上局配置，请先完成一次“开始随机抽卡”。');
            return;
        }

        try {
            const config = JSON.parse(raw);
            applyConfig(config);

            drawStatus.textContent = '已恢复上局配置，可直接开始抽卡。';
        } catch {
            alert('上局配置读取失败，请重新配置并开始新一局。');
        }
    }

    function collectConfiguredRoles() {
        const selected = [];

        document.querySelectorAll('.role-enable').forEach(checkbox => {
            if (!checkbox.checked) return;

            const roleId = checkbox.dataset.roleId;
            const role = roles.find(r => r.id === roleId);
            const countInput = document.querySelector(`.role-count-input[data-role-id="${roleId}"]`);
            const count = Math.max(1, Number(countInput?.value) || 1);

            if (role) {
                selected.push({ name: role.name, icon: role.icon, count });
            }
        });

        customRoles.forEach(role => {
            selected.push({ name: role.name, icon: role.icon, count: Math.max(1, Number(role.count) || 1) });
        });

        return selected;
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startDrawSession() {
        if (hasActiveSession()) {
            const keyword = prompt('检测到当前局仍有记录。为避免误操作丢失，本次会先自动备份当前局。\n请输入“开始新局”继续：');
            if (keyword === null) {
                return;
            }
            if (keyword.trim() !== '开始新局') {
                alert('口令错误，已取消开新局。');
                return;
            }
            backupCurrentSessionState();
        }

        const configuredRoles = collectConfiguredRoles();
        const nextDeck = [];

        configuredRoles.forEach(role => {
            for (let i = 0; i < role.count; i++) {
                nextDeck.push({ name: role.name, icon: role.icon });
            }
        });

        if (nextDeck.length === 0) {
            alert('请至少选择一个角色或添加一个自定义角色。');
            return;
        }

        saveCurrentConfig();

        drawDeck = shuffleArray(nextDeck);
        drawIndex = 0;
        drawFrontVisible = false;
        judgeState = {};
        tempJudgeStateSnapshot = null;
        updateTempActionButtons();

        drawCard.classList.remove('is-flipped');
        drawFrontText.textContent = '角色';
        drawPanel.classList.remove('hidden');
        allResult.classList.add('hidden');
        allResultList.innerHTML = '';
        updateDrawStatus();
        saveCurrentSessionState();
    }

    function renderAllRolesResult() {
        ensureJudgeState();
        allResultList.innerHTML = '';
        removedList.innerHTML = '';

        let removedCount = 0;

        drawDeck.forEach((role, index) => {
            const playerNo = index + 1;
            const state = judgeState[playerNo] || { marked: false, removed: false };
            const li = document.createElement('li');
            li.className = 'player-row';

            if (state.marked) {
                li.classList.add('marked');
            }

            const no = document.createElement('span');
            no.className = 'player-no';
            no.textContent = `${playerNo}号：`;

            const roleText = document.createElement('span');
            roleText.className = 'player-role';
            roleText.textContent = `${role.icon} ${role.name}`;

            const actions = document.createElement('div');
            actions.className = 'row-actions';

            const markBtn = document.createElement('button');
            markBtn.className = 'mini-btn';
            markBtn.type = 'button';
            markBtn.textContent = state.marked ? '取消删除线' : '加删除线';
            markBtn.onclick = () => toggleMark(playerNo);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'mini-btn';
            removeBtn.type = 'button';
            removeBtn.textContent = '删除玩家';
            removeBtn.onclick = () => setPlayerRemoved(playerNo, true);

            actions.appendChild(markBtn);
            actions.appendChild(removeBtn);

            li.appendChild(no);
            li.appendChild(roleText);
            li.appendChild(actions);

            if (state.removed) {
                removedCount += 1;

                const removedLi = document.createElement('li');
                removedLi.className = 'player-row';

                const removedNo = document.createElement('span');
                removedNo.className = 'player-no';
                removedNo.textContent = `${playerNo}号：`;

                const removedRole = document.createElement('span');
                removedRole.className = 'player-role';
                removedRole.textContent = `${role.icon} ${role.name}`;

                const removedActions = document.createElement('div');
                removedActions.className = 'row-actions';

                const restoreBtn = document.createElement('button');
                restoreBtn.className = 'mini-btn';
                restoreBtn.type = 'button';
                restoreBtn.textContent = '恢复玩家';
                restoreBtn.onclick = () => setPlayerRemoved(playerNo, false);

                removedActions.appendChild(restoreBtn);
                removedLi.appendChild(removedNo);
                removedLi.appendChild(removedRole);
                removedLi.appendChild(removedActions);
                removedList.appendChild(removedLi);
            } else {
                allResultList.appendChild(li);
            }
        });

        removedBlock.classList.toggle('hidden', removedCount === 0);
    }

    function toggleMark(playerNo) {
        ensureJudgeState();
        if (tempJudgeStateSnapshot) {
            tempJudgeStateSnapshot = null;
            updateTempActionButtons();
        }
        judgeState[playerNo].marked = !judgeState[playerNo].marked;
        renderAllRolesResult();
        saveCurrentSessionState();
    }

    function setPlayerRemoved(playerNo, removed) {
        ensureJudgeState();
        if (tempJudgeStateSnapshot) {
            tempJudgeStateSnapshot = null;
            updateTempActionButtons();
        }
        judgeState[playerNo].removed = removed;
        renderAllRolesResult();
        saveCurrentSessionState();
    }

    function resetJudgeAnnotations() {
        if (!isSessionFinished()) {
            alert('当前局尚未抽完，暂不能恢复控制台初始状态。');
            return;
        }

        if (tempJudgeStateSnapshot) {
            alert('你已经在临时状态中，请先点“恢复临时前状态”。');
            return;
        }

        tempJudgeStateSnapshot = cloneJudgeState(judgeState);
        judgeState = {};
        ensureJudgeState();
        updateTempActionButtons();
        renderAllRolesResult();
        saveCurrentSessionState();
    }

    function restoreTemporaryJudgeState() {
        if (!isSessionFinished()) {
            alert('当前局尚未抽完，暂不能恢复临时前状态。');
            return;
        }

        if (!tempJudgeStateSnapshot) {
            alert('没有可恢复的临时前状态。');
            return;
        }

        judgeState = cloneJudgeState(tempJudgeStateSnapshot);
        tempJudgeStateSnapshot = null;
        ensureJudgeState();
        updateTempActionButtons();
        renderAllRolesResult();
        saveCurrentSessionState();
    }

    function confirmRevealAllRoles() {
        if (!isSessionFinished()) {
            alert('当前局尚未抽完，不能查看全员身份。');
            return;
        }

        const keyword = prompt('⚠️ 高危操作：请确认当前只有法官可见。\n请输入“我是法官”：');
        if (keyword === null) {
            return;
        }

        if (keyword.trim() !== '我是法官') {
            alert('口令错误，已取消显示。');
            return;
        }

        renderAllRolesResult();
        allResult.classList.remove('hidden');
        saveCurrentSessionState();
    }

    function handleDrawCardClick() {
        if (drawDeck.length === 0) return;

        if (drawFrontVisible) {
            drawFrontVisible = false;
            drawIndex += 1;
            drawCard.classList.remove('is-flipped');
            updateDrawStatus();
            saveCurrentSessionState();
            return;
        }

        if (drawIndex >= drawDeck.length) {
            updateDrawStatus();
            return;
        }

        const currentRole = drawDeck[drawIndex];
        drawFrontText.textContent = `${currentRole.icon} ${currentRole.name}`;
        drawFrontVisible = true;
        drawCard.classList.add('is-flipped');
        updateDrawStatus();
        saveCurrentSessionState();
    }

    function updateDrawStatus() {
        if (drawDeck.length === 0) {
            if (!drawStatus.textContent || drawStatus.textContent === '尚未开始抽卡。') {
                drawStatus.textContent = '尚未开始抽卡。';
            }
            return;
        }

        const total = drawDeck.length;
        const shown = Math.min(drawIndex, total);

        if (!drawFrontVisible && drawIndex >= total) {
            drawStatus.textContent = `已抽完全部 ${total} 张。`;
            return;
        }

        if (drawFrontVisible) {
            drawStatus.textContent = `当前 ${drawIndex + 1}/${total} ，请再次点击。`;
            return;
        }

        drawStatus.textContent = `已完成 ${shown}/${total} 。点击翻开下一张。`;
    }

    window.addEventListener('beforeunload', (e) => {
        if (!hasActiveSession()) return;
        e.preventDefault();
        e.returnValue = '';
    });

    renderRoleConfig();
    renderCustomRoles();
    restoreCurrentSessionState();
</script>
</body>
</html>
