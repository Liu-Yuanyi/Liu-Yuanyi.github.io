<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人杀角色图鉴 - 进阶版</title>
    <style>
        :root {
            --primary-bg: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e94560;
            --good-Color: #4ecca3;
            --god-color: #ffd700;
            --wolf-color: #e94560;
            --third-color: #a64ac9;
            --modal-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary-bg);
            color: #fff;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        p.subtitle {
            color: #bbb;
            margin-top: 10px;
            font-style: italic;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .faction-section {
            margin-bottom: 50px;
        }

        .faction-title {
            border-left: 5px solid;
            padding-left: 15px;
            margin-bottom: 25px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
        }
        
        .faction-good { border-color: var(--good-Color); color: var(--good-Color); }
        .faction-god { border-color: var(--god-color); color: var(--god-color); }
        .faction-wolf { border-color: var(--wolf-color); color: var(--wolf-color); }
        .faction-third { border-color: var(--third-color); color: var(--third-color); }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .role-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.2);
        }

        .role-icon {
            font-size: 3em;
            margin-bottom: 10px;
            display: block;
        }

        .role-name {
            font-weight: bold;
            font-size: 1.1em;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #252a34;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh; /* 限制最大高度 */
            overflow-y: auto; /* 超出则滚动 */
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-title {
            margin-top: 0;
            color: var(--god-color); 
            font-size: 2em;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modal-section-title {
            font-size: 1.2em;
            color: #ddd;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: bold;
            border-left: 3px solid #e94560;
            padding-left: 10px;
        }

        .skill-desc {
            font-size: 1.05em;
            line-height: 1.8;
            color: #eee;
        }

        .rule-list {
            list-style-type: none;
            padding: 0;
        }

        .rule-list li {
            background: rgba(255,255,255,0.05);
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            align-items: flex-start;
        }

        .rule-list li::before {
            content: "💡";
            margin-right: 10px;
            font-size: 1.2em;
        }

        /* Navigation Buttons */
        .modal-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-btn {
            background-color: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background-color: var(--text-color);
            border-color: var(--text-color);
            transform: translateY(-2px);
        }

        /* Tag styles */
        .tag {
            font-size: 0.6em;
            padding: 2px 8px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 10px;
            background: #444;
            color: #fff;
            font-weight: normal;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 { font-size: 1.8em; }
            .modal-content { padding: 25px; }
        }
    </style>
</head>
<body>

<header>
    <h1>🐺 狼人杀角色进阶图鉴</h1>
    <p class="subtitle">具体细则以法官为准</p>
</header>

<div class="container">

    <!-- 好人阵营 - 神职 -->
    <div class="faction-section">
        <h2 class="faction-title faction-god">好人阵营 · 神职</h2>
        <div class="cards-grid" id="god-cards">
            <!-- Cards will be injected via JS -->
        </div>
    </div>

    <!-- 好人阵营 - 平民 -->
    <div class="faction-section">
        <h2 class="faction-title faction-good">好人阵营 · 平民</h2>
        <div class="cards-grid" id="villager-cards">
            <!-- Cards will be injected via JS -->
        </div>
    </div>

    <!-- 坏人阵营 -->
    <div class="faction-section">
        <h2 class="faction-title faction-wolf">坏人阵营 (狼人)</h2>
        <div class="cards-grid" id="wolf-cards">
            <!-- Cards will be injected via JS -->
        </div>
    </div>

    <!-- 第三方阵营 -->
    <div class="faction-section">
        <h2 class="faction-title faction-third">第三方 / 特殊身份</h2>
        <div class="cards-grid" id="third-cards">
            <!-- Cards will be injected via JS -->
        </div>
    </div>
</div>

<!-- Modal Structure -->
<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        <h2 class="modal-title" id="m-title">角色名称</h2>
        
        <div class="modal-section-title">技能概要</div>
        <div class="skill-desc" id="m-desc"></div>

        <div class="modal-section-title">进阶判例 & 规则细节</div>
        <ul class="rule-list" id="m-rules"></ul>

        <!-- Navigation -->
        <div class="modal-nav">
            <button class="nav-btn" id="prevRole" onclick="navigateRole(-1)">
                <span>←</span>
                <span id="prev-name">上一个</span>
            </button>
            <button class="nav-btn" id="nextRole" onclick="navigateRole(1)">
                <span id="next-name">下一个</span>
                <span>→</span>
            </button>
        </div>
    </div>
</div>

<script>
    const roles = [
        // --- 神职 ---
        {
            id: 'seer',
            name: '预言家',

            desc: '每晚可以查验一名玩家的身份是好人还是狼人。',
            rules: [
                '无法知道具体身份。',
                '验到“隐狼”显示为好人。',

        {
            id: 'witch',
            name: '女巫',
            icon: '🧪',

            desc: '拥有一瓶解药和一瓶毒药。每晚只能使用一瓶。解药可以救活一名当晚被狼刀的玩家，毒药可以毒杀一名玩家。',
            rules: [
                '同守同救（奶穿肠）：如果一名玩家当晚同时被守卫守护和被女巫解药救，该玩家死亡。',

                '被毒杀的玩家没有遗言。',
            ]
        },
        {
            id: 'hunter',
            name: '猎人',
            icon: '🔫',
            type: 'god',
            desc: '当猎人死亡（被狼人刀杀或被投票处决）时，可以开枪带走一名玩家。',
            rules: [
                '被女巫毒杀是否能开枪？（通常不能，称“闷枪”）。',
                '被殉情（随情侣死亡）是否能开枪？（视规则而定，通常不能）。',
                '开枪是否强制带人？（通常可以压枪不带人）。'
            ]
        },
        {
            id: 'guard',
            name: '守卫',
            icon: '🛡️',
            type: 'god',
            desc: '每晚可以守护一名玩家，该玩家当晚不会被狼人杀害。不能连续两晚守护同一个人。',
            rules: [
                '同守同救（奶穿肠）：如果一名玩家当晚同时被守卫守护和被女巫解药救，该玩家死亡。',
                '守卫可以自守。',
                '只能挡狼刀，不能挡其他方式的死亡（如女巫的毒药）。'
            ]
        },
        {
            id: 'idiot',
            name: '白痴',
            icon: '🤪',
            type: 'god',
            desc: '平时与普通村民无异。在白天投票处决环节被投出时，可以翻牌亮明身份，免除死亡，但之后失去投票权。',
            rules: [
                '翻牌后狼人可以选择追刀白痴。',
                '翻牌后正常轮次发言。',
                '翻牌后属于“存活”状态，仍需占坑位。'
            ]
        },
        {
            id: 'knight',
            name: '骑士',
            icon: '⚔️',
            type: 'god',
            desc: '在白天发言阶段，可以随时翻牌决斗一名玩家。若该玩家是狼人，则该狼人死亡，骑士存活，且当立即入夜；若该玩家是好人，则骑士以死谢罪，该好人存活。',
            rules: [
                '只要是狼人阵营即判定为狼人。',
                '第一天通常也能决斗（视规则而定）。',
            ]
        },
        {
            id: 'mogui',
            name: '魔术师',
            icon: '🎩',
            type: 'god',
            desc: '每晚在狼人杀人之后，可以交换两个人的号码牌。当晚针对这两个号码的所有判定（验人、毒药、刀人等）随之交换。',
            rules: [
                '全局每张牌只能交换一次。',
                '自己是否可以换自己？（可以）。',
                '可以选择不交换（即不发动技能）'
            ]
        },
        {
            id: 'shemeng',
            name: '摄梦人',
            icon: '🍷',
            type: 'god',
            desc: '每晚必须选择一名玩家成为梦游者。梦游者不知道自己正在梦游，梦游者当晚免疫狼刀和毒药。如果摄梦人死亡，梦游者随之殉情。连续两晚摄同一名玩家，该玩家直接死亡（由于精力耗尽）。',
            rules: [
                '不能选择自己为梦游者。'
            ]
        },

        // --- 平民 ---
        {
            id: 'villager',
            name: '普通村民',
            icon: '🧑',
            type: 'villager',
            desc: '没有特殊技能。主要靠逻辑分析和投票帮助好人阵营获胜。',
            rules: []
        },
        // {
        //     id: 'laoliulang',
        //     name: '老流氓',
        //     icon: '🚬',
        //     type: 'villager',
        //     desc: '平民牌，不会被魅惑，被毒死或者枪带不会翻牌。',
        //     rules: [
        //         '进阶板子角色，主要克制第三方或具有魅惑功能的角色。'
        //     ]
        // },

        // --- 狼人 ---
        {
            id: 'wolf',
            name: '狼人',
            icon: '🐺',
            type: 'wolf',
            desc: '每晚可以与其他狼人商议杀害一名玩家。白天可以自爆，立即入夜。',
            rules: [
                '可以空刀，可以自刀',
                '屠边：杀完神/杀完民即可获胜。屠城：杀光所有其他阵营的人才获胜。'
            ]
        },
        {
            id: 'wolf_king',
            name: '狼王',
            icon: '👑',
            type: 'wolf',
            desc: '死后可以开枪带走一人。',
            rules: [
                '被毒杀不能开枪。',
                '发动技能规则基本等同于猎人。'
            ]
        },
        {
            id: 'white_wolf',
            name: '白狼王',
            icon: '🗯️',
            type: 'wolf',
            desc: '在白天发言阶段，可以随时自爆并带走场上一名玩家。然后直接进入黑夜，没有遗言。',
            rules: []
        },
        {
            id: 'ghost_rider',
            name: '恶灵骑士',
            icon: '👻',
            type: 'wolf',
            desc: '不能自爆，与狼人一同行动。拥有一次性的反伤技能：若被预言家查验，次日预言家出局；若被女巫使用毒药，次日女巫出局。',
            rules: [
                '反伤女巫时，自己不会被毒死。'
            ]
        },
        {
            id: 'gargoyle',
            name: '石像鬼',
            icon: '🗿',
            type: 'wolf',
            desc: '不进狼群（与其他狼队友不互认），晚上不刀人，不能自爆。每晚可以查验一名玩家的具体身份（具体角色）。当其他狼同伴全部出局后，进入狼群并获得刀。',
            rules: []
        },
        {
            id: 'hidden_wolf',
            name: '隐狼',
            icon: '🎭',
            type: 'wolf',
            desc: '不能自曝身份，被预言家查验结果始终为好人。隐狼夜间知道其他哪些玩家是狼人，但不进狼群。当其他狼同伴全部出局后，进入狼群并获得刀。',
            rules: []
        },

        // --- 第三方/特殊 ---
        {
            id: 'cupid',
            name: '丘比特',
            icon: '💘',
            type: 'third',
            desc: '第一晚选择两名玩家成为情侣。情侣中一人死，另一人随之殉情。',
            rules: [            ]
        },
        {
            id: 'piper',
            name: '吹笛者',
            icon: '🎵',
            type: 'third',
            desc: '每晚可以迷惑两名玩家，闭眼后所有已经被迷惑的玩家互认。被迷惑的玩家在之后的游戏中依然正常行动。胜利条件是场上所有存活玩家都被迷惑。',
            rules: [
                '胜利的必要条件是吹笛者还活着。'
            ]
        }
    ];

    // Functions to render content
    function renderCards() {
        const sections = {
            god: document.getElementById('god-cards'),
            villager: document.getElementById('villager-cards'),
            wolf: document.getElementById('wolf-cards'),
            third: document.getElementById('third-cards')
        };

        roles.forEach(role => {
            const card = document.createElement('div');
            card.className = 'role-card';
            card.onclick = () => openModal(role);
            
            card.innerHTML = `
                <span class="role-icon">${role.icon}</span>
                <div class="role-name">${role.name}</div>
            `;
            
            if (sections[role.type]) {
                sections[role.type].appendChild(card);
            }
        });
    }

    // Modal Logic
    const modal = document.getElementById('modal');
    const mTitle = document.getElementById('m-title');
    const mDesc = document.getElementById('m-desc');
    const mRules = document.getElementById('m-rules');
    
    let currentRoleIndex = -1;

    function openModal(role) {
        currentRoleIndex = roles.findIndex(r => r.id === role.id);
        updateModalContent();
        modal.classList.add('active');
    }
    
    function updateModalContent() {
        const role = roles[currentRoleIndex];
        
        mTitle.innerHTML = `${role.icon} ${role.name} <span class="tag" style="background:${getFactionColor(role.type)}">${getFactionName(role.type)}</span>`;
        mTitle.style.color = getFactionColor(role.type);
        mDesc.textContent = role.desc;
        
        mRules.innerHTML = '';
        if (role.rules && role.rules.length > 0) {
            role.rules.forEach(rule => {
                const li = document.createElement('li');
                li.textContent = rule;
                mRules.appendChild(li);
            });
        } else {
            mRules.innerHTML = '暂无';
        }
        
        updateNavButtons();
    }
    
    function updateNavButtons() {
        const prevIndex = (currentRoleIndex - 1 + roles.length) % roles.length;
        const nextIndex = (currentRoleIndex + 1) % roles.length;
        
        document.getElementById('prev-name').textContent = roles[prevIndex].name;
        document.getElementById('next-name').textContent = roles[nextIndex].name;
    }
    
    function navigateRole(direction) {
        currentRoleIndex = (currentRoleIndex + direction + roles.length) % roles.length;
        updateModalContent();
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (!modal.classList.contains('active')) return;
        
        if (e.key === 'ArrowLeft') navigateRole(-1);
        if (e.key === 'ArrowRight') navigateRole(1);
        if (e.key === 'Escape') closeModal();
    });

    // Close modal when clicking outside
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            closeModal();
        }
    });

    // Helper for styles
    function getFactionColor(type) {
        switch(type) {
            case 'god': return '#ffd700';
            case 'villager': return '#4ecca3';
            case 'wolf': return '#e94560'; // '#ff4b4b';
            case 'third': return '#a64ac9';
            default: return '#fff';
        }
    }

    function getFactionName(type) {
        switch(type) {
            case 'god': return '神职';
            case 'villager': return '平民';
            case 'wolf': return '狼人';
            case 'third': return '第三方';
            default: return '未知';
        }
    }

    // Init
    renderCards();

</script>

</body>
</html>
